<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3D-Global-RishuRana</title>
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden}
 #top{position:absolute;left:15px;top:15px;z-index:10;color:#fff;font-family:sans-serif;background:rgba(0,0,0,0.7);padding:12px 16px;border-radius:12px;border:1px solid #00ffff88}
</style>
<script type="importmap">
{
 "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "globe.gl": "https://cdn.jsdelivr.net/npm/globe.gl@2.32.0/+esm"
 }
}
</script>
</head>
<body>
<div id="top">🌍 3D-GLOBAL-RISHU RANA | HACKER MODE | Gurugram</div>
<script type="module">
import Globe from 'globe.gl';

const world = Globe()
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .showAtmosphere(true)
  .atmosphereColor('#00ffff')
  .atmosphereAltitude(0.4)
  (document.body);

world.controls().autoRotate = true;
world.controls().autoRotateSpeed = 1.2;

// BADA GLOBE ke liye altitude kam = globe bada dikhega
world.pointOfView({lat: 20, lng: 77, altitude: 1.2});

// Gurugram pulse
const gData = [{lat:28.4595,lng:77.0266}];
world
  .pointsData(gData).pointColor(()=>'#00ffff').pointAltitude(0.2).pointRadius(1)
  .ringsData(gData).ringColor(()=>'#00ffff').ringMaxRadius(8).ringPropagationSpeed(5).ringRepeatPeriod(800)
  .labelsData([{lat:28.4595,lng:77.0266,name:"GURUGRAM - RISHU"}]).labelText('name').labelColor(()=>'#00ffff').labelSize(2);
</script>
</body>
</html>
